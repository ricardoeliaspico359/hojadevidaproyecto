<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Hoja de Vida{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4e8ee);
            min-height: 100vh;
        }

        /* =========================
           NAVBAR ANIMADO (AISLADO)
        ========================== */
        .navbar {
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        }

        .navbar::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                120deg,
                #22d3ee,
                #0d6efd,
                #6366f1,
                #22d3ee
            );
            background-size: 300% 300%;
            animation: navbarMove 6s ease infinite;
            z-index: 0;
        }

        @keyframes navbarMove {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* CONTENIDO DEL NAVBAR ENCIMA */
        .navbar > * {
            position: relative;
            z-index: 1;
        }

        .navbar-brand {
            font-weight: 600;
            font-size: 1.4rem;
        }

        /* =========================
           BOTÓN ADMIN
        ========================== */
        .btn-admin {
            border-radius: 25px;
            padding: 6px 18px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-admin:hover {
            background-color: #ffffff;
            color: #212529;
            transform: translateY(-2px);
        }

        /* =========================
           CONTENEDOR PRINCIPAL
        ========================== */
        .main-container {
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        }

        /* =========================
           ANIMACIÓN DE VISTAS
        ========================== */
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .view-animation {
            animation: fadeSlide 0.6s ease-out;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand">📄 Mi Hoja de Vida</span>

        <a href="/admin/" class="btn btn-outline-light btn-admin">
            ⚙️ Administrar
        </a>
    </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-5">
    <div class="main-container view-animation">
        {% block content %}{% endblock %}
    </div>
</div>

</body>
</html>
