{% extends 'base.html' %}

{% block content %}

<style>
    /* ===========================
       ANIMACIONES GENERALES
    ============================ */
    @keyframes fadeSlide {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* ===========================
       NAVBAR ANIMADA (AZUL)
    ============================ */
    .navbar {
        background: linear-gradient(
            120deg,
            #22d3ee,
            #0d6efd,
            #6366f1,
            #22d3ee
        ) !important;
        background-size: 300% 300%;
        animation: navbarMove 6s ease infinite;
    }

    @keyframes navbarMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* ===========================
       TITULO
    ============================ */
    .page-title {
        animation: fadeSlide 0.8s ease forwards;
        color: #0d6efd;
        font-weight: bold;
    }

    /* ===========================
       BOTÓN PDF 🔥
    ============================ */
    .pdf-btn {
        opacity: 0;
        animation: fadeSlide 0.9s ease forwards;
        animation-delay: 0.2s;
    }

    .pdf-animated {
        background: linear-gradient(
            120deg,
            #7f1d1d,
            #dc2626,
            #f97316,
            #fde047,
            #f97316,
            #dc2626,
            #7f1d1d
        );
        background-size: 400% 400%;
        animation: fireMove 3s linear infinite;
        border: none;
        color: #ffffff;
        font-weight: 600;
        transition: transform 0.3s ease;
    }

    /* ✅ FIX: mantiene texto blanco en hover */
    .pdf-animated:hover {
        transform: translateY(-4px) scale(1.05);
        color: #ffffff;
    }

    @keyframes fireMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* ===========================
       PANEL CONTENEDOR
    ============================ */
    .glow-panel {
        position: relative;
        padding: 32px;
        border-radius: 26px;
        background:
            linear-gradient(#ffffff, #ffffff) padding-box,
            linear-gradient(
                120deg,
                #22d3ee,
                #0d6efd,
                #6366f1,
                #4f46e5,
                #22d3ee,
                #0d6efd
            ) border-box;
        border: 6px solid transparent;
        background-size: 400% 400%;
        animation: panelMove 4s linear infinite;
    }

    @keyframes panelMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* ===========================
       DASHBOARD CARDS
    ============================ */
    .dashboard-card {
        cursor: pointer;
        transition: all 0.3s ease;
        border-radius: 15px;
        background: #ffffff;
        opacity: 0;
        animation: fadeUp 0.7s ease forwards;
    }

    .dashboard-card:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow: 0 15px 35px rgba(13, 110, 253, 0.35);
        background: linear-gradient(135deg, #f8f9fa, #eef3ff);
    }

    .dashboard-card h1 {
        transition: transform 0.3s ease;
    }

    .dashboard-card:hover h1 {
        transform: scale(1.2);
    }

    /* ===========================
       STAGGER
    ============================ */
    .dashboard-card:nth-child(1) { animation-delay: 0.1s; }
    .dashboard-card:nth-child(2) { animation-delay: 0.2s; }
    .dashboard-card:nth-child(3) { animation-delay: 0.3s; }
    .dashboard-card:nth-child(4) { animation-delay: 0.4s; }
    .dashboard-card:nth-child(5) { animation-delay: 0.5s; }
    .dashboard-card:nth-child(6) { animation-delay: 0.6s; }
    .dashboard-card:nth-child(7) { animation-delay: 0.7s; }

</style>

<h2 class="mb-4 text-center page-title">Mi Hoja de Vida</h2>

<!-- BOTÓN PDF -->
<div class="mb-4 text-center pdf-btn">
    <a href="{% url 'generar_pdf' %}" target="_blank"
       class="btn btn-lg px-5 pdf-animated">
        📄 Descargar Hoja de Vida (PDF)
    </a>
</div>

<!-- PANEL -->
<div class="glow-panel">
    <div class="row g-4">

        <div class="col-md-6 col-lg-4">
            <a href="{% url 'datos_personales' %}" class="text-decoration-none">
                <div class="card shadow h-100 text-center p-4 dashboard-card">
                    <h1>🧍</h1>
                    <h5>Datos Personales</h5>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-lg-4">
            <a href="{% url 'experiencia_laboral' %}" class="text-decoration-none">
                <div class="card shadow h-100 text-center p-4 dashboard-card">
                    <h1>💼</h1>
                    <h5>Experiencia Laboral</h5>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-lg-4">
            <a href="{% url 'cursos' %}" class="text-decoration-none">
                <div class="card shadow h-100 text-center p-4 dashboard-card">
                    <h1>🎓</h1>
                    <h5>Cursos Realizados</h5>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-lg-4">
            <a href="{% url 'reconocimientos' %}" class="text-decoration-none">
                <div class="card shadow h-100 text-center p-4 dashboard-card">
                    <h1>🏆</h1>
                    <h5>Reconocimientos</h5>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-lg-4">
            <a href="{% url 'productos_academicos' %}" class="text-decoration-none">
                <div class="card shadow h-100 text-center p-4 dashboard-card">
                    <h1>📘</h1>
                    <h5>Productos Académicos</h5>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-lg-4">
            <a href="{% url 'productos_laborales' %}" class="text-decoration-none">
                <div class="card shadow h-100 text-center p-4 dashboard-card">
                    <h1>🛠️</h1>
                    <h5>Productos Laborales</h5>
                </div>
            </a>
        </div>

        <div class="col-md-12">
            <a href="{% url 'venta_garage' %}" class="text-decoration-none">
                <div class="card shadow h-100 text-center p-4 dashboard-card bg-light">
                    <h1>🛒</h1>
                    <h5>Venta Garage</h5>
                </div>
            </a>
        </div>

    </div>
</div>

{% endblock %}
